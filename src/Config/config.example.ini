; ============================================================================
; Plantilla de configuración del gateway.
;
;   cp src/Config/config.example.ini src/Config/config.ini
;
; config.ini NO se versiona: es el estado operativo de cada equipo y el propio
; programa lo reescribe en caliente (watchdog + set_device_value).
;
; El watchdog relee config.ini cada 2 s, así que modbusconnect y modbusread se
; aplican sin reiniciar el servicio.
; ============================================================================

[DEFAULT]
loglevel = INFO
logstdout = True
logfile = src/Log/gateway_ems.log
max_size_bytes = 1485760
backup_count = 5
sampleslog = False

[MAINMODBUS]
; Secciones de dispositivo a cargar, separadas por coma.
; Cada nombre necesita su propia sección [<nombre>] más abajo.
; Vacío = el gateway arranca sin dispositivos.
devicesnames =

; Periodo de lectura en segundos
interval = 1

; Ventana horaria activa (0-23)
start_hour = 0
stop_hour = 23


; ----------------------------------------------------------------------------
; Ejemplo RTU (RS485 serie).
; Para activarlo: devicesnames = Modbus_DTSU666
; ----------------------------------------------------------------------------
; [Modbus_DTSU666]
; ; UUID del equipo: se usa como tag en InfluxDB
; identify_device = 00000000-0000-0000-0000-000000000000
; ; Tipo de equipo: tag en InfluxDB (CT_Meter, Inverter, Battery, ...)
; device_type = CT_Meter
;
; protocol = RTU
; serialport = /dev/ttyUSB0
; baudrate = 9600
;
; ; Mapa de registros del dispositivo
; mapfile = src/Modbus/maps/Modbus_DTSU666.json
;
; ; Uno o varios esclavos del mismo bus, separados por coma: 11,12,13
; device_id = 11
;
; ; Código de función Modbus: 3 = holding registers, 4 = input registers
; modbus_function = 3
;
; ; true  = agrupa direcciones cercanas en bloques (menos transacciones)
; ; false = una lectura por variable (equipos sin lectura continua)
; blockreading = true
;
; ; Interruptores en caliente. Leer exige conexión: si pones modbusread = true
; ; con modbusconnect = false, el sistema lo corrige solo.
; modbusconnect = false
; modbusread = false


; ----------------------------------------------------------------------------
; Ejemplo TCP (Ethernet).
; Para activarlo: devicesnames = Inversor_TCP
; ----------------------------------------------------------------------------
; [Inversor_TCP]
; identify_device = 00000000-0000-0000-0000-000000000000
; device_type = Inverter
; protocol = TCP
; host = 192.168.1.100
; port = 502
; mapfile = src/Modbus/maps/Inversor.json
; device_id = 1,2
; modbus_function = 3
; blockreading = true
; modbusconnect = false
; modbusread = false
